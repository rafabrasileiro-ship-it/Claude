plugins {
    id 'com.android.application'
}

def buildNumber = (System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger()
def ciKeystore = System.getenv('COMBATE_KEYSTORE')

android {
    namespace 'com.rafa.combate'
    compileSdk 34

    signingConfigs {
        if (ciKeystore) {
            release {
                storeFile file(ciKeystore)
                storePassword System.getenv('COMBATE_STORE_PASS')
                keyAlias 'combate'
                keyPassword System.getenv('COMBATE_STORE_PASS')
            }
        }
    }

    defaultConfig {
        applicationId 'com.rafa.combate'
        minSdk 21
        targetSdk 34
        versionCode buildNumber
        versionName "1.0.${buildNumber}"
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig ciKeystore ? signingConfigs.release : signingConfigs.debug
        }
    }

    // A interface do jogo é a mesma página do servidor Node (fonte única).
    sourceSets {
        main { assets.srcDirs = ['../../combate/public'] }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
