plugins {
    id 'com.android.application'
}

android {
    namespace 'com.rafa.dino'
    compileSdk 34

    defaultConfig {
        applicationId 'com.rafa.dino'
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            // Assina com a chave de debug para o APK poder ser instalado direto.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
