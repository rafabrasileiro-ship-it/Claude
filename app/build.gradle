plugins {
    id 'com.android.application'
}

// Número da versão: sobe sozinho a cada build no GitHub (run number); local usa 1.
def buildNumber = (System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger()

android {
    namespace 'com.rafa.dino'
    compileSdk 34


    defaultConfig {
        applicationId 'com.rafa.dino'
        minSdk 21
        targetSdk 34
        versionCode buildNumber
        versionName "1.0.${buildNumber}"
    }

    buildTypes {
        release {
            minifyEnabled false
            // Assina com a chave de debug para o APK poder ser instalado direto.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
