plugins {
    id 'com.android.application'
}

// Número da versão: sobe sozinho a cada build no GitHub (run number); local usa 1.
def buildNumber = (System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger()

// Chave de assinatura criada e guardada pelo GitHub Actions (não fica no repositório).
def ciKeystore = System.getenv('DINO_KEYSTORE')

android {
    namespace 'com.rafa.dino'
    compileSdk 34

    signingConfigs {
        if (ciKeystore) {
            release {
                storeFile file(ciKeystore)
                storePassword System.getenv('DINO_STORE_PASS')
                keyAlias 'dino'
                keyPassword System.getenv('DINO_STORE_PASS')
            }
        }
    }

    defaultConfig {
        applicationId 'com.rafa.dino.jogo'
        minSdk 21
        targetSdk 34
        versionCode buildNumber
        versionName "1.0.${buildNumber}"
    }

    buildTypes {
        release {
            minifyEnabled false
            // Sem a chave do CI (build local), assina com a de debug.
            signingConfig ciKeystore ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
