name: Conservalingo APK

on:
  workflow_dispatch:
  push:
    paths: ["conservalingo/**", ".github/workflows/build-conservalingo-apk.yml"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: conservalingo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: conservalingo/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci
      - run: npm test
      - name: Gerar projeto Android nativo
        run: npx expo prebuild --platform android --no-install
      - name: Reduzir ABIs (celulares ARM de 32 e 64 bits)
        run: sed -i 's/^reactNativeArchitectures=.*/reactNativeArchitectures=armeabi-v7a,arm64-v8a/' android/gradle.properties
      - name: Compilar APK (release)
        working-directory: conservalingo/android
        run: ./gradlew assembleRelease --no-daemon
      - name: Copiar APK
        run: |
          mkdir -p ../dist
          cp android/app/build/outputs/apk/release/app-release.apk ../dist/conservalingo.apk
      - uses: actions/upload-artifact@v4
        with:
          name: conservalingo-apk
          path: dist/conservalingo.apk
