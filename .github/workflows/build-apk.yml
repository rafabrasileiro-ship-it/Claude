name: Gerar APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compilar APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: jogo-do-dino-apk
          path: app/build/outputs/apk/release/*.apk
      - name: Salvar APK no repositório
        run: |
          mkdir -p dist
          git rm -q --ignore-unmatch dist/*.apk
          cp app/build/outputs/apk/release/*.apk dist/jogo-do-dino-v${{ github.run_number }}.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist/
          git commit -m "Atualiza APK v${{ github.run_number }} [skip ci]" || exit 0
          git push
