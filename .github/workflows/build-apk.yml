name: Gerar APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DINO_KEYSTORE: ${{ github.workspace }}/dino-release.keystore
      DINO_STORE_PASS: ${{ secrets.DINO_STORE_PASS || 'dino-ci-chave' }}
      DINO_KEYSTORE_B64: ${{ secrets.DINO_KEYSTORE_B64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Chave de assinatura (secret do GitHub)
        run: |
          if [ -n "$DINO_KEYSTORE_B64" ]; then
            echo "$DINO_KEYSTORE_B64" | base64 -d > dino-release.keystore
          else
            echo "::warning::Secrets DINO_KEYSTORE_B64 e DINO_STORE_PASS não cadastrados: usando chave temporaria (o APK NAO instala por cima do anterior)."
            keytool -genkeypair -keystore dino-release.keystore -alias dino \
              -keyalg RSA -keysize 2048 -validity 36500 \
              -storepass "$DINO_STORE_PASS" -keypass "$DINO_STORE_PASS" \
              -dname "CN=Jogo do Dino"
          fi
      - name: Compilar APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: jogo-do-dino-apk
          path: app/build/outputs/apk/release/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: operacao-patriota-apk
          path: patriota/build/outputs/apk/release/*.apk
      - name: Salvar APK no repositório
        run: |
          git rm -q --ignore-unmatch dist/*.apk
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk dist/jogo-do-dino-v${{ github.run_number }}.apk
          cp patriota/build/outputs/apk/release/*.apk dist/operacao-patriota-v${{ github.run_number }}.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist/
          git commit -m "Atualiza APK v${{ github.run_number }} [skip ci]" || exit 0
          git push
