name: Gerar APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DINO_KEYSTORE: ${{ github.workspace }}/dino-release.keystore
      DINO_STORE_PASS: dino-ci-chave
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Restaurar chave de assinatura
        uses: actions/cache@v4
        with:
          path: dino-release.keystore
          key: dino-keystore-v1
      - name: Criar chave de assinatura (só na primeira vez)
        run: |
          if [ ! -f dino-release.keystore ]; then
            keytool -genkeypair -keystore dino-release.keystore -alias dino \
              -keyalg RSA -keysize 2048 -validity 36500 \
              -storepass "$DINO_STORE_PASS" -keypass "$DINO_STORE_PASS" \
              -dname "CN=Jogo do Dino"
          fi
      - name: Compilar APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: jogo-do-dino-apk
          path: app/build/outputs/apk/release/*.apk
      - name: Salvar APK no repositório
        run: |
          git rm -q --ignore-unmatch dist/jogo-do-dino-*.apk
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk dist/jogo-do-dino-v${{ github.run_number }}.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist/
          git commit -m "Atualiza APK v${{ github.run_number }} [skip ci]" || exit 0
          # Outro workflow (ex.: Dedos Twister) pode ter dado push antes: refaz por cima e tenta de novo.
          for i in 1 2 3 4; do
            git pull --rebase origin "${{ github.ref_name }}" && git push && exit 0
            sleep $((i * 3))
          done
          exit 1
