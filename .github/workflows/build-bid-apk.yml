name: Gerar APK do BID

on:
  push:
    paths: ["bid/**", "settings.gradle", ".github/workflows/build-bid-apk.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BID_KEYSTORE: ${{ github.workspace }}/bid-release.keystore
      BID_STORE_PASS: bid-ci-chave
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Testar lógica (Java puro)
        run: |
          mkdir -p /tmp/core-out
          javac -encoding UTF-8 -d /tmp/core-out bid/src/main/java/com/rafa/bid/core/*.java bid/tests/CoreSelfTest.java
          java -Dfile.encoding=UTF-8 -cp /tmp/core-out CoreSelfTest
      - name: Restaurar chave de assinatura
        uses: actions/cache@v4
        with:
          path: bid-release.keystore
          key: bid-keystore-v1
      - name: Criar chave de assinatura (só na primeira vez)
        run: |
          if [ ! -f bid-release.keystore ]; then
            keytool -genkeypair -keystore bid-release.keystore -alias bid \
              -keyalg RSA -keysize 2048 -validity 36500 \
              -storepass "$BID_STORE_PASS" -keypass "$BID_STORE_PASS" \
              -dname "CN=BID Scraper"
          fi
      - name: Compilar APK
        run: |
          chmod +x gradlew
          ./gradlew :bid:assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: bid-scraper-android-apk
          path: bid/build/outputs/apk/release/*.apk
