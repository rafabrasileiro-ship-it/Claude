<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b0a08">
<title>BR-APOCALIPSE</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="cv"></canvas>

<div id="ctl" class="hide">
  <div class="top">
    <button data-act="pause">⏸</button>
    <button data-act="toggleRole" id="bRole">🔁 JANELA</button>
    <button data-act="toggleCam" id="bCam">📷</button>
  </div>
  <button id="bAbil" class="abil" data-act="useAbility">⚡</button>
  <button id="qte" class="hide" data-act="qtePress">CHUTAR!</button>

  <div id="pilot">
    <button class="b sm" style="left:2vw;bottom:44vh" data-act="pressWiper">🧽<small>LIMPADOR</small></button>
    <button class="b sm" style="left:12vw;bottom:44vh" data-act="toggleLights">💡<small>FAROL</small></button>
    <button class="b big" style="left:2vw;bottom:5vh" data-steer="-1">◀</button>
    <button class="b big" style="left:16vw;bottom:5vh" data-steer="1">▶</button>
    <button class="b sm" id="bSaw" style="right:26vw;bottom:44vh" data-act="toggleSaws">🪚<small>SERRAS</small></button>
    <button class="b sm" style="right:14vw;bottom:44vh" data-hold="hand">🅿<small>FREIO MÃO</small></button>
    <button class="b sm red" style="right:2vw;bottom:44vh" data-hold="fire">🔥<small>ARMA</small></button>
    <button class="b big" style="right:16vw;bottom:5vh" data-hold="brake">FREIO<small>/ RÉ</small></button>
    <button class="b big acc" style="right:2vw;bottom:5vh" data-hold="gas">ACEL</button>
  </div>

  <div id="gunner" class="hide">
    <button class="b sm" id="bExp" style="left:2vw;bottom:44vh" data-act="toggleExpose">🙇<small>AGACHAR</small></button>
    <button class="b sm" style="left:12vw;bottom:44vh" data-act="nextSeat">💺<small>ASSENTO</small></button>
    <button class="b sm" style="left:2vw;bottom:24vh" data-act="toggleLook">↩<small>OLHAR TRÁS</small></button>
    <button class="b sm" style="left:12vw;bottom:24vh" data-act="startReload">🔄<small>RECARGA</small></button>
    <div class="pings">
      <button data-ping="-1">◀ ESQ!</button><button data-ping="0">CAPÔ!</button><button data-ping="1">DIR! ▶</button>
    </div>
    <button class="b sm" style="right:26vw;bottom:44vh" data-act="cycleWeapon">🔫<small>TROCAR</small></button>
    <button class="b sm" id="bMelee" style="right:14vw;bottom:44vh" data-act="toggleMelee">🔪<small>ARMA BRANCA</small></button>
    <button class="b sm" id="bAds" style="right:2vw;bottom:44vh" data-toggle="ads">🎯<small>MIRA</small></button>
    <button class="b big red" style="right:2vw;bottom:5vh" data-hold="fire">FOGO</button>
  </div>
</div>

<div id="ui"></div>
<div id="rot">📱↻<br>Gire o celular para o modo paisagem</div>

<script src="js/data.js"></script>
<script src="js/sons.js"></script>
<script src="js/audio.js"></script>
<script src="js/draw.js"></script>
<script src="js/game.js"></script>
<script src="js/boss.js"></script>
<script src="js/net.js"></script>
<script src="js/gl.js"></script>
<script src="js/tex3d.js"></script>
<script src="js/world3d.js"></script>
<script src="js/zombie3d.js"></script>
<script src="js/zanim3d.js"></script>
<script src="js/kit3d.js"></script>
<script src="js/veh3d.js"></script>
<script src="js/scene3d.js"></script>
<script src="js/boss3d.js"></script>
<script src="js/fx3d.js"></script>
<script src="js/carfx.js"></script>
<script src="js/arms3d.js"></script>
<script src="js/guns3d.js"></script>
<script src="js/vm3d.js"></script>
<script src="js/cabin3d.js"></script>
<script src="js/render.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
